<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yard Capture — Job 22028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171B;
  --panel:#1E2127;
  --panel2:#262A31;
  --line:#343941;
  --hi:#F2C230;
  --go:#54B87F;
  --stop:#E2504F;
  --warn:#E8913C;
  --text:#EEF0F2;
  --dim:#949BA5;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"Barlow Condensed",Impact,var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  display:flex;flex-direction:column;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--line);padding:10px 16px 9px;
  display:flex;align-items:center;gap:12px;flex:none;
}
.job{flex:1;min-width:0}
.job b{
  font-family:var(--cond);font-weight:700;font-size:15px;
  letter-spacing:.04em;color:var(--hi);display:block;line-height:1.1;
}
.job span{
  display:block;font-size:13px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lang{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:none}
.lang button{padding:6px 11px;font-size:12px;font-weight:600;color:var(--dim)}
.lang button[aria-pressed="true"]{background:var(--hi);color:#15171B}

/* ---------- progress ---------- */
.ticks{display:flex;gap:3px;padding:9px 16px;flex:none}
.tick{height:5px;flex:1;background:var(--panel2);border-radius:1px;transition:background .2s}
.tick.done{background:var(--go)}
.tick.skip{background:var(--warn)}
.tick.now{background:var(--hi)}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.count{font-size:12px;color:var(--dim);letter-spacing:.09em;font-weight:600}
h1{
  font-family:var(--cond);font-weight:600;
  font-size:clamp(38px,11vw,52px);line-height:.94;
  margin:6px 0 10px;letter-spacing:-.005em;
}
.how{font-size:16px;color:#C8CDD4;margin:0 0 14px;max-width:34em}
.req{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
  font-weight:600;padding:4px 10px;border-radius:4px;margin-bottom:16px;
}
.req.must{background:rgba(226,80,79,.13);color:#F08C8B}
.req.opt{background:var(--panel2);color:var(--dim)}

figure{
  margin:0 0 20px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:16px;
}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:12.5px;color:var(--dim);margin-top:10px}

/* ---------- capture ---------- */
.dock{
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--panel);flex:none;
}
.shoot{
  width:100%;background:var(--hi);color:#15171B;
  font-family:var(--cond);font-weight:700;font-size:25px;letter-spacing:.03em;
  padding:19px;border-radius:9px;
}
.shoot:active{transform:scale(.988)}
.minor{
  width:100%;padding:13px;margin-top:9px;font-size:14.5px;
  color:var(--dim);border:1px solid var(--line);border-radius:8px;
}
input[type=file]{display:none}

/* ---------- review ---------- */
.sheet{
  position:fixed;inset:0;background:var(--ink);z-index:20;
  display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.sheet.on{display:flex}
.shot-wrap{
  flex:1;min-height:0;background:#0C0E11;
  display:flex;align-items:center;justify-content:center;padding:14px;
}
.shot-wrap img{max-width:100%;max-height:100%;border-radius:7px;object-fit:contain}
.checks{padding:14px 16px 4px;flex:none}
.chk{
  display:flex;gap:11px;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;
}
.chk:last-child{border-bottom:0}
.dot{
  width:19px;height:19px;border-radius:50%;flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#15171B;
}
.dot.ok{background:var(--go)}
.dot.no{background:var(--stop);color:#fff}
.dot.hm{background:var(--warn)}
.dot.wait{background:var(--panel2);color:var(--dim)}
.chk b{font-weight:600;display:block}
.chk small{color:var(--dim);font-size:12.5px;display:block;margin-top:1px}
.verdict{
  margin:12px 16px 0;padding:13px 15px;border-radius:8px;
  font-size:14.5px;font-weight:600;
}
.verdict.pass{background:rgba(84,184,127,.13);color:#87D6A9}
.verdict.fail{background:rgba(226,80,79,.13);color:#F08C8B}
.acts{display:flex;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.acts button{flex:1;padding:16px;border-radius:8px;font-weight:600;font-size:16px}
.keep{background:var(--go);color:#0E1A13}
.keep[disabled]{background:var(--panel2);color:#5D646E}
.again{border:1px solid var(--line);color:var(--text)}

/* ---------- skip ---------- */
.reasons{padding:0 16px}
.reasons button{
  width:100%;text-align:left;padding:16px 15px;margin-bottom:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:15.5px;
}
.reasons button:active{border-color:var(--hi)}

/* ---------- inspection form ---------- */
.isec{
  font-family:var(--cond);font-weight:600;font-size:21px;letter-spacing:.02em;
  color:var(--hi);margin:26px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line);
}
.q{margin:17px 0}
.q label{display:block;font-size:16px;font-weight:600;margin-bottom:9px;line-height:1.3}
.need{color:var(--stop);font-style:normal;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{
  padding:11px 14px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:14.5px;line-height:1.25;text-align:left;
}
.opt.on{background:var(--hi);color:#15171B;border-color:var(--hi);font-weight:600}
.q input,.q textarea{
  width:100%;padding:14px;font:inherit;font-size:16px;
  background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:7px;
}
.q input:focus,.q textarea:focus{outline:2px solid var(--hi);outline-offset:1px}
.q textarea{resize:vertical}
.shoot:disabled{cursor:default}

/* ---------- done ---------- */
.done{padding:26px 18px;text-align:center}
.done h1{font-size:clamp(34px,10vw,46px)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
  gap:7px;margin:20px 0;
}
.grid div{
  position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;
  background:var(--panel2);
}
.grid img{width:100%;height:100%;object-fit:cover}
.grid span{
  position:absolute;left:0;right:0;bottom:0;background:rgba(10,12,15,.82);
  font-size:9.5px;padding:3px 4px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.grid div.gap{display:grid;place-items:center;color:var(--warn);font-size:11px;padding:6px;text-align:center}
.stat{
  display:flex;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:14.5px;
}
.stat span{color:var(--dim)}
.stat b{font-family:var(--cond);font-size:19px;font-weight:600}
.sub{color:var(--dim);font-size:14px;margin-top:20px;text-align:left}
</style>
</head>
<body>

<header>
  <div class="job">
    <b id="jobno">JOB 22028</b>
    <span id="jobdesc">2016 Kenworth T880 Dump · Hiram, GA</span>
  </div>
  <div class="lang">
    <button id="en" aria-pressed="true">EN</button>
    <button id="es" aria-pressed="false">ES</button>
  </div>
</header>

<div class="ticks" id="ticks"></div>

<main id="main"></main>

<div class="dock" id="dock">
  <button class="shoot" id="shoot"></button>
  <button class="minor" id="skip"></button>
  <button class="minor" id="pick"></button>
  <input type="file" id="cam" accept="image/*" capture="environment">
  <input type="file" id="lib" accept="image/*">
</div>

<!-- review -->
<div class="sheet" id="review">
  <div class="shot-wrap"><img id="preview" alt=""></div>
  <div class="checks" id="checks"></div>
  <div class="verdict" id="verdict"></div>
  <div class="acts">
    <button class="again" id="again"></button>
    <button class="keep" id="keep"></button>
  </div>
</div>

<!-- skip reasons -->
<div class="sheet" id="skipsheet">
  <main>
    <div class="count" id="skiplabel"></div>
    <h1 id="skiptitle"></h1>
    <div class="reasons" id="reasons"></div>
  </main>
  <div class="acts"><button class="again" id="skipcancel"></button></div>
</div>

/* ============================================================

/* ============================================================
   Quality checks — run on a downscaled copy for speed.
   The ORIGINAL file is what gets uploaded, never the canvas.
   ============================================================ */
const MIN_MP = 3.0;          // below this a listing photo looks soft
const TILE_SHARP = 45;       // per-tile laplacian variance to count as in focus
const SHARP_SHARE = 0.42;    // share of tiles that must be sharp
const DARK = 52, BRIGHT = 212;
const EDGE_BLEED = 0.30;
const BLOB_SHARE = 0.055;    // share of frame covered by an obstruction
const SKIN_SHARE = 0.030;    // share of frame that looks like skin

const GX = 8, GY = 6;        // analysis grid

function analyse(img){
  const W = 560, H = Math.max(1, Math.round(img.naturalHeight / img.naturalWidth * W));
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data;

  const g = new Float32Array(W*H);
  const skin = new Uint8Array(W*H);
  let sum = 0, skinCount = 0;

  for(let i=0, p=0; i<px.length; i+=4, p++){
    const r=px[i], gr=px[i+1], b=px[i+2];
    const v = 0.299*r + 0.587*gr + 0.114*b;
    g[p] = v; sum += v;

    // YCbCr skin range — indicative only, biased, so warning not block
    const cb = 128 - 0.168736*r - 0.331264*gr + 0.5*b;
    const cr = 128 + 0.5*r - 0.418688*gr - 0.081312*b;
    if(cb>=77 && cb<=130 && cr>=134 && cr<=180 && r>60 && r>b){
      skin[p]=1; skinCount++;
    }
  }
  const mean = sum/(W*H);

  // ---- per-tile focus. A finger over the lens is a soft patch inside an
  // otherwise sharp frame, and a global average hides it completely.
  const tw = Math.floor(W/GX), th = Math.floor(H/GY);
  const tile = [];
  for(let ty=0; ty<GY; ty++){
    for(let tx=0; tx<GX; tx++){
      const x0=tx*tw, y0=ty*th, x1=Math.min(x0+tw,W-1), y1=Math.min(y0+th,H-1);
      let ls=0, lss=0, n=0, sk=0, tot=0;
      for(let y=Math.max(y0,1); y<y1; y++){
        for(let x=Math.max(x0,1); x<x1; x++){
          const p=y*W+x;
          const l = 4*g[p]-g[p-1]-g[p+1]-g[p-W]-g[p+W];
          ls+=l; lss+=l*l; n++;
          sk+=skin[p]; tot++;
        }
      }
      const v = n ? (lss/n - (ls/n)**2) : 0;
      tile.push({tx,ty,v,sharp:v>=TILE_SHARP,skin:tot?sk/tot:0,
                 edge: tx===0||ty===0||tx===GX-1||ty===GY-1});
    }
  }

  const sharpShare = tile.filter(t=>t.sharp).length / tile.length;

  // ---- obstruction: a run of soft tiles anchored to a frame edge, while the
  // rest of the picture is in focus. That is a thumb, a strap, a coat.
  const soft = tile.filter(t=>!t.sharp);
  const at = (tx,ty)=> tile[ty*GX+tx];
  const seen = new Set();
  let blob = 0, blobEdge = false, blobSkin = 0;
  for(const t of soft){
    const key = t.ty*GX+t.tx;
    if(seen.has(key)) continue;
    const stack=[t]; seen.add(key);
    let size=0, touches=false, sk=0;
    while(stack.length){
      const cur = stack.pop();
      size++; sk += cur.skin;
      if(cur.edge) touches = true;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cur.tx+dx, ny=cur.ty+dy;
        if(nx<0||ny<0||nx>=GX||ny>=GY) continue;
        const nb = at(nx,ny), k = ny*GX+nx;
        if(!nb.sharp && !seen.has(k)){ seen.add(k); stack.push(nb); }
      }
    }
    if(size > blob){ blob = size; blobEdge = touches; blobSkin = sk/size; }
  }
  const blobShare = blob / tile.length;
  const obstructed = blobEdge && blobShare >= BLOB_SHARE && sharpShare > 0.45;

  // ---- sobel bleed for cut-off
  let emax = 1;
  const edge = new Float32Array(W*H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const p=y*W+x;
    const gx = -g[p-W-1]-2*g[p-1]-g[p+W-1] + g[p-W+1]+2*g[p+1]+g[p+W+1];
    const gy = -g[p-W-1]-2*g[p-W]-g[p-W+1] + g[p+W-1]+2*g[p+W]+g[p+W+1];
    const m = Math.hypot(gx,gy);
    edge[p]=m; if(m>emax) emax=m;
  }
  const band = Math.max(2, Math.round(H*0.022));
  const thr = emax*0.30;
  let hot=0, tot=0;
  const touch=(x,y)=>{ if(edge[y*W+x]>thr) hot++; tot++; };
  for(let x=0;x<W;x++) for(let b=0;b<band;b++){ touch(x,b); touch(x,H-1-b); }
  for(let y=0;y<H;y++) for(let b=0;b<band;b++){ touch(b,y); touch(W-1-b,y); }
  const bleed = hot/Math.max(tot,1);

  // ---- skin near an edge suggests a hand held in the shot
  let edgeSkin = 0, edgeTot = 0;
  const eb = Math.round(H*0.16);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(y<eb||y>H-1-eb||x<eb||x>W-1-eb){ edgeSkin += skin[y*W+x]; edgeTot++; }
  }
  const skinShare = skinCount/(W*H);
  const skinEdgeShare = edgeTot ? edgeSkin/edgeTot : 0;
  const handLikely = skinShare >= SKIN_SHARE && skinEdgeShare > skinShare*1.15;

  const mp = img.naturalWidth*img.naturalHeight/1e6;
  return {
    w:img.naturalWidth, h:img.naturalHeight,
    mp:mp.toFixed(1), mpRaw:mp,
    sharpShare, mean, bleed,
    obstructed, blobShare, blobSkin,
    handLikely, skinShare
  };
}


/* ============================================================
   Inspection — controlled vocabulary, never a free-text box where
   a picklist will do. "Couldn't check" is always a valid answer;
   a blank field tells the appraiser nothing.
   ============================================================ */
const NOTE = { en:"Add a note (optional)", es:"Agregar nota (opcional)" };

const INSPECT = [
{ sec:{en:"Starting and running",es:"Arranque y funcionamiento"}, items:[
  { id:"starts", req:true,
    en:"Does it start?", es:"¿Arranca?",
    opts:[["Starts on the key","Arranca con la llave"],["Needed a jump","Necesitó puente"],
          ["Cranks, won't start","Da marcha, no arranca"],["No power at all","Sin energía"],
          ["Didn't try","No se intentó"]] },
  { id:"lights", req:true, multi:true,
    en:"Warning lights on the dash", es:"Luces de advertencia en el tablero",
    opts:[["None showing","Ninguna"],["Check engine","Motor"],["DEF / emissions","DEF / emisiones"],
          ["Oil pressure","Presión de aceite"],["Coolant temp","Temperatura"],
          ["ABS / brakes","ABS / frenos"],["Air pressure","Presión de aire"],
          ["Couldn't check","No se pudo revisar"]] },
  { id:"odo", req:true, num:true,
    en:"Odometer reading", es:"Lectura del odómetro",
    ph:{en:"e.g. 497379",es:"ej. 497379"} },
  { id:"vin", req:true, text:true,
    en:"VIN, as printed on the plate", es:"VIN, como aparece en la placa",
    ph:{en:"17 characters",es:"17 caracteres"} }
]},
{ sec:{en:"Engine",es:"Motor"}, items:[
  { id:"engmake", req:true, text:true,
    en:"Engine make and model, from the tag", es:"Marca y modelo del motor, de la placa",
    ph:{en:"e.g. PACCAR MX-13",es:"ej. PACCAR MX-13"} },
  { id:"trans", req:true,
    en:"Transmission", es:"Transmisión",
    opts:[["Automatic — no clutch pedal","Automática — sin pedal de embrague"],
          ["Manual — has a clutch pedal","Manual — con pedal de embrague"],
          ["Couldn't tell","No se pudo determinar"]] },
  { id:"oil",
    en:"Oil on the dipstick", es:"Aceite en la varilla",
    opts:[["Full and clean","Lleno y limpio"],["Full but dark","Lleno pero oscuro"],
          ["Low","Bajo"],["Milky or foamy","Lechoso o espumoso"],["Couldn't check","No se pudo revisar"]] },
  { id:"leaks", multi:true,
    en:"Leaks you can see", es:"Fugas visibles",
    opts:[["None","Ninguna"],["Oil","Aceite"],["Coolant","Refrigerante"],["Fuel","Combustible"],
          ["Hydraulic","Hidráulica"],["Couldn't check","No se pudo revisar"]] }
]},
{ sec:{en:"Outside",es:"Exterior"}, items:[
  { id:"body", req:true,
    en:"Body and paint", es:"Carrocería y pintura",
    opts:[["No damage observed","Sin daños observados"],["Normal work wear","Desgaste normal de trabajo"],
          ["See notes — damage","Ver notas — daños"],["Obstructed","Obstruido"]] },
  { id:"glass",
    en:"Glass", es:"Vidrios",
    opts:[["All good","Todos bien"],["Chipped","Astillado"],["Cracked","Estrellado"],
          ["Broken or missing","Roto o faltante"]] },
  { id:"tires", req:true,
    en:"Tire tread, worst position", es:"Banda de las llantas, la peor",
    opts:[["Good — over half","Buena — más de la mitad"],["Fair — about half","Regular — mitad"],
          ["Poor — nearly bald","Mala — casi lisa"],["Flat or missing","Ponchada o faltante"],
          ["Couldn't check","No se pudo revisar"]] },
  { id:"mismatch",
    en:"Are the tires mismatched?", es:"¿Las llantas son diferentes entre sí?",
    opts:[["All the same","Todas iguales"],["Mixed brands or tread","Marcas o dibujos mezclados"],
          ["Couldn't check","No se pudo revisar"]] }
]},
{ sec:{en:"Inside the cab",es:"Interior de la cabina"}, items:[
  { id:"seat",
    en:"Seat", es:"Asiento",
    opts:[["Good","Bueno"],["Worn","Desgastado"],["Torn","Roto"],["Missing","Faltante"]] },
  { id:"interior",
    en:"Interior overall", es:"Interior en general",
    opts:[["No damage observed","Sin daños observados"],["Normal work wear","Desgaste normal"],
          ["See notes","Ver notas"],["Obstructed","Obstruido"]] },
  { id:"ac",
    en:"Does the A/C blow cold?", es:"¿El aire acondicionado enfría?",
    opts:[["Yes","Sí"],["Blows, not cold","Sopla, no enfría"],["No","No"],["Didn't try","No se intentó"]] }
]},
{ sec:{en:"Body and equipment",es:"Caja y equipo"}, items:[
  { id:"bed",
    en:"Dump body condition", es:"Condición de la caja",
    opts:[["No damage observed","Sin daños observados"],["Dented but sound","Abollada pero firme"],
          ["Cracked or holed","Agrietada o perforada"],["Not applicable","No aplica"]] },
  { id:"hoist", req:true,
    en:"Does the bed raise and lower?", es:"¿La caja sube y baja?",
    opts:[["Yes, full cycle","Sí, ciclo completo"],["Raises but slow or weak","Sube lento o débil"],
          ["No","No"],["Didn't try","No se intentó"],["Not applicable","No aplica"]] },
  { id:"gate",
    en:"Does the tailgate work?", es:"¿Funciona la compuerta?",
    opts:[["Yes","Sí"],["Sticks","Se atora"],["No","No"],["Didn't try","No se intentó"],
          ["Not applicable","No aplica"]] }
]},
{ sec:{en:"Anything else",es:"Algo más"}, items:[
  { id:"capture",
    en:"Anything that got in the way of this inspection?", es:"¿Algo que dificultó esta inspección?",
    opts:[["Nothing","Nada"],["Unit was dead, had to jump it","Estaba muerta, hubo que darle puente"],
          ["Parked too tight for good photos","Muy apretada para buenas fotos"],
          ["Weather","Clima"],["Couldn't open something","No se pudo abrir algo"],
          ["Other — see notes","Otra — ver notas"]] },
  { id:"final", text:true, long:true,
    en:"Notes for the appraiser", es:"Notas para el evaluador",
    ph:{en:"Anything a buyer would want to know",es:"Algo que un comprador querría saber"} }
]}
];

const answers = {};

function inspectDone(){
  return INSPECT.every(g => g.items.every(it =>
    !it.req || (answers[it.id] && String(answers[it.id]).trim() !== "" &&
                (!it.multi || answers[it.id].length))));
}

function renderInspect(){
  dock.style.display = "block";
  $("#shoot").textContent = t("send");
  $("#shoot").disabled = !inspectDone();
  $("#shoot").style.opacity = inspectDone() ? "1" : ".45";
  $("#skip").style.display = "none";
  $("#pick").style.display = "none";

  main.innerHTML = `
    <div class="count">${t("inspectStep")}</div>
    <h1>${t("inspectTitle")}</h1>
    <p class="how">${t("inspectHow")}</p>
    ${INSPECT.map(g=>`
      <div class="isec">${g.sec[lang]}</div>
      ${g.items.map(it=>renderItem(it)).join("")}
    `).join("")}
    <div style="height:8px"></div>`;
  wireInspect();
  drawTicks();
}

function renderItem(it){
  const label = it[lang];
  const need = it.req ? `<i class="need">•</i>` : "";
  if(it.text || it.num){
    const v = answers[it.id] || "";
    return `<div class="q"><label for="f_${it.id}">${need}${label}</label>
      ${it.long
        ? `<textarea id="f_${it.id}" data-id="${it.id}" rows="3" placeholder="${it.ph[lang]}">${v}</textarea>`
        : `<input id="f_${it.id}" data-id="${it.id}" type="${it.num?"number":"text"}"
             inputmode="${it.num?"numeric":"text"}" placeholder="${it.ph[lang]}" value="${v}">`}
    </div>`;
  }
  const cur = answers[it.id] || (it.multi ? [] : null);
  const opts = it.opts.map((o,i)=>{
    const txt = lang==="en" ? o[0] : o[1];
    const on = it.multi ? cur.includes(i) : cur===i;
    return `<button class="opt${on?" on":""}" data-id="${it.id}" data-i="${i}"
              data-multi="${it.multi?1:0}">${txt}</button>`;
  }).join("");
  return `<div class="q"><label>${need}${label}</label><div class="opts">${opts}</div></div>`;
}

function wireInspect(){
  main.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, i=+b.dataset.i, multi=b.dataset.multi==="1";
      if(multi){
        const cur = answers[id] || [];
        answers[id] = cur.includes(i) ? cur.filter(x=>x!==i) : [...cur, i];
      } else {
        answers[id] = answers[id]===i ? null : i;
      }
      const scroll = main.scrollTop;
      renderInspect();
      main.scrollTop = scroll;
    };
  });
  main.querySelectorAll("input,textarea").forEach(f=>{
    f.oninput = ()=>{
      answers[f.dataset.id] = f.value;
      const ok = inspectDone();
      $("#shoot").disabled = !ok;
      $("#shoot").style.opacity = ok ? "1" : ".45";
    };
  });
}

/* ============================================================
   State
   ============================================================ */
let lang = "en";
let phase = "photos";
let idx = 0;
const results = {};   // id -> {url, meta} | {skipped, reason}
let pending = null;

const $ = s => document.querySelector(s);
const main=$("#main"), dock=$("#dock"), ticksEl=$("#ticks");
const review=$("#review"), skipsheet=$("#skipsheet"), cam=$("#cam");

function t(k, ...a){ const v=T[lang][k]; return typeof v==="function"?v(...a):v; }

function drawTicks(){
  const last = phase==="done" ? "tick done"
             : phase==="inspect" ? "tick now" : "tick";
  ticksEl.innerHTML = SHOTS.map((s,i)=>{
    const r = results[s.id];
    let cls = "tick";
    if(r && r.skipped) cls += " skip";
    else if(r) cls += " done";
    else if(i===idx) cls += " now";
    return `<div class="${cls}"></div>`;
  }).join("") + `<div class="${last}" style="flex:.6"></div>`;
}

function render(){
  if(phase === "inspect"){ renderInspect(); return; }
  if(phase === "done"){ finish(); return; }
  if(idx >= SHOTS.length){ phase = "inspect"; renderInspect(); return; }
  const s = SHOTS[idx];
  const [title, how] = s[lang];
  main.innerHTML = `
    <div class="count">${t("shotOf", idx+1, SHOTS.length)}</div>
    <h1>${title}</h1>
    <p class="how">${how}</p>
    <div class="req ${s.must?"must":"opt"}">${s.must?"●":"○"} ${s.must?t("must"):t("opt")}</div>
    <figure>${ART[s.art]||""}</figure>
  `;
  $("#shoot").textContent = t("shoot");
  $("#shoot").disabled = false;
  $("#shoot").style.opacity = "1";
  $("#skip").textContent = t("skip");
  $("#pick").style.display = "block";
  $("#skip").style.display = s.must ? "block" : "none";
  $("#pick").textContent = t("pick");
  main.scrollTop = 0;
  drawTicks();
}

/* ---------- capture ---------- */
$("#shoot").onclick = ()=>{
  if(phase === "inspect"){ if(inspectDone()){ phase="done"; finish(); } return; }
  cam.click();
};

function handleFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    const meta = analyse(img);
    meta.bytes = file.size;
    pending = { url, file, meta };
    showReview(img, meta);
  };
  img.src = url;
}
cam.onchange = handleFile;
$("#lib").onchange = handleFile;
$("#pick").onclick = ()=> $("#lib").click();

function showReview(img, m){
  $("#preview").src = m ? img.src : "";
  const rows = [];
  const row=(state,label,hint)=>rows.push(
    `<div class="chk"><div class="dot ${state}">${state==="ok"?"✓":state==="no"?"✕":state==="hm"?"!":"…"}</div>
     <div><b>${label}</b><small>${hint}</small></div></div>`);

  const resOk = m.mpRaw >= MIN_MP;
  row(resOk?"ok":"no", resOk?t("resOk",m):t("resLow",m), resOk?t("resHint"):t("resLowHint"));

  const sharp = m.sharpShare >= SHARP_SHARE;
  row(sharp?"ok":"no", sharp?t("sharp"):t("soft"), sharp?t("sharpHint"):t("softHint"));

  row(m.obstructed?"no":"ok", m.obstructed?t("covered"):t("clear"),
      m.obstructed?t("coveredHint"):t("clearHint"));

  row(m.handLikely?"hm":"ok", m.handLikely?t("hands"):t("noHands"),
      m.handLikely?t("handsHint"):t("noHandsHint"));

  const dark = m.mean < DARK, blown = m.mean > BRIGHT;
  row(dark||blown?"hm":"ok", dark?t("dark"):blown?t("bright"):t("light"),
      dark?t("darkHint"):blown?t("brightHint"):t("lightHint"));

  const framed = m.bleed < EDGE_BLEED;
  row(framed?"ok":"hm", framed?t("frame"):t("cut"), framed?t("frameHint"):t("cutHint"));

  $("#checks").innerHTML = rows.join("");

  const blocked = !resOk || !sharp || m.obstructed;
  const v = $("#verdict");
  v.className = "verdict " + (blocked ? "fail" : "pass");
  v.textContent = blocked ? t("fail") : t("pass");
  $("#keep").disabled = blocked;
  $("#keep").textContent = t("keep");
  $("#again").textContent = t("again");
  review.classList.add("on");
}

$("#keep").onclick = ()=>{
  results[SHOTS[idx].id] = pending;
  pending = null;
  review.classList.remove("on");
  idx++; render();
};
$("#again").onclick = ()=>{
  if(pending) URL.revokeObjectURL(pending.url);
  pending = null;
  review.classList.remove("on");
};

/* ---------- skip ---------- */
$("#skip").onclick = ()=>{
  $("#skiplabel").textContent = t("shotOf", idx+1, SHOTS.length);
  $("#skiptitle").textContent = t("why");
  $("#reasons").innerHTML = SKIP_REASONS[lang]
    .map((r,i)=>`<button data-i="${i}">${r}</button>`).join("");
  $("#reasons").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      results[SHOTS[idx].id] = { skipped:true, reason:SKIP_REASONS[lang][+b.dataset.i] };
      skipsheet.classList.remove("on");
      idx++; render();
    };
  });
  $("#skipcancel").textContent = t("cancel");
  skipsheet.classList.add("on");
};
$("#skipcancel").onclick = ()=> skipsheet.classList.remove("on");

/* ---------- finish ---------- */
function finish(){
  const taken = Object.values(results).filter(r=>!r.skipped);
  const skipped = Object.values(results).filter(r=>r.skipped);
  const mps = taken.map(r=>r.meta.mpRaw);
  const low = mps.length ? Math.min(...mps).toFixed(1) : "—";
  const avg = mps.length ? (mps.reduce((a,b)=>a+b,0)/mps.length).toFixed(1) : "—";

  const cells = SHOTS.map(s=>{
    const r = results[s.id];
    if(r && !r.skipped)
      return `<div><img src="${r.url}" alt=""><span>${s[lang][0]}</span></div>`;
    if(r && r.skipped)
      return `<div class="gap">${r.reason}</div>`;
    return `<div class="gap">${t("missing")}<br>${s[lang][0]}</div>`;
  }).join("");

  main.innerHTML = `
    <div class="done">
      <h1>${t("doneTitle")}</h1>
      <div class="grid">${cells}</div>
      <div class="stat"><span>${t("sTotal")}</span><b>${taken.length}</b></div>
      <div class="stat"><span>${t("sSkipped")}</span><b>${skipped.length}</b></div>
      <div class="stat"><span>${t("sSize")}</span><b>${low} MP</b></div>
      <div class="stat"><span>${t("sAvg")}</span><b>${avg} MP</b></div>
      <div class="isec" style="margin-top:22px">${t("inspectSum")}</div>
      ${summarise()}
      <p class="sub">${t("doneSub")}</p>
      <p class="sub">${t("tip")}</p>
    </div>`;
  dock.style.display = "none";
  drawTicks();
}

function summarise(){
  const out = [];
  INSPECT.forEach(g => g.items.forEach(it => {
    const a = answers[it.id];
    if(a === undefined || a === null || a === "" || (Array.isArray(a) && !a.length)) return;
    let v;
    if(it.opts) v = Array.isArray(a)
        ? a.map(i=>lang==="en"?it.opts[i][0]:it.opts[i][1]).join(", ")
        : (lang==="en"?it.opts[a][0]:it.opts[a][1]);
    else v = a;
    out.push(`<div class="stat"><span>${it[lang]}</span><b style="font-size:14px;font-family:var(--sans);text-align:right;max-width:58%">${v}</b></div>`);
  }));
  return out.join("");
}

/* ---------- language ---------- */
function setLang(l){
  lang = l;
  $("#en").setAttribute("aria-pressed", l==="en");
  $("#es").setAttribute("aria-pressed", l==="es");
  document.documentElement.lang = l;
  render();
}
$("#en").onclick = ()=> setLang("en");
$("#es").onclick = ()=> setLang("es");

render();
</script>
