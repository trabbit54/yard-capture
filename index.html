<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yard Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171B;--panel:#1E2127;--panel2:#262A31;--line:#343941;
  --hi:#F2C230;--go:#54B87F;--stop:#E2504F;--warn:#E8913C;
  --text:#EEF0F2;--dim:#949BA5;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"Barlow Condensed",Impact,var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

header{border-bottom:1px solid var(--line);padding:10px 16px 9px;display:flex;align-items:center;gap:12px;flex:none}
.job{flex:1;min-width:0}
.job b{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--hi);display:block;line-height:1.1}
.job span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:none}
.lang button{padding:6px 11px;font-size:12px;font-weight:600;color:var(--dim)}
.lang button[aria-pressed="true"]{background:var(--hi);color:#15171B}

.ticks{display:flex;gap:2px;padding:9px 16px;flex:none}
.tick{height:5px;flex:1;background:var(--panel2);border-radius:1px;transition:background .2s}
.tick.done{background:var(--go)}
.tick.part{background:var(--go);opacity:.45}
.tick.skip{background:var(--warn)}
.tick.now{background:var(--hi)}

main{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.count{font-size:12px;color:var(--dim);letter-spacing:.09em;font-weight:600}
h1{font-family:var(--cond);font-weight:600;font-size:clamp(36px,10.5vw,50px);line-height:.95;margin:6px 0 10px;letter-spacing:-.005em}
.how{font-size:16px;color:#C8CDD4;margin:0 0 14px;max-width:34em}
.req{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:4px;margin-bottom:16px}
.req.must{background:rgba(226,80,79,.13);color:#F08C8B}
.req.opt{background:var(--panel2);color:var(--dim)}
.req.ok{background:rgba(84,184,127,.14);color:#87D6A9}

.strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.strip>div{position:relative;flex:none;width:82px;height:62px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;
  background:rgba(12,14,17,.85);color:#fff;font-size:15px;line-height:20px;text-align:center}

figure{margin:0 0 20px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px}
figure svg{width:100%;height:auto;display:block}

.dock{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);flex:none}
.shoot{width:100%;background:var(--hi);color:#15171B;font-family:var(--cond);font-weight:700;
  font-size:25px;letter-spacing:.03em;padding:19px;border-radius:9px}
.shoot:active{transform:scale(.988)}
.shoot:disabled{cursor:default}
.minor{width:100%;padding:13px;margin-top:9px;font-size:14.5px;color:var(--dim);border:1px solid var(--line);border-radius:8px}
input[type=file]{display:none}

.sheet{position:fixed;inset:0;background:var(--ink);z-index:20;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
.sheet.on{display:flex}
.shot-wrap{flex:1;min-height:0;background:#0C0E11;display:flex;align-items:center;justify-content:center;padding:14px}
.shot-wrap img{max-width:100%;max-height:100%;border-radius:7px;object-fit:contain}
.checks{padding:12px 16px 2px;flex:none;overflow-y:auto;max-height:44vh}
.chk{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.chk:last-child{border-bottom:0}
.dot{width:19px;height:19px;border-radius:50%;flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#15171B}
.dot.ok{background:var(--go)}
.dot.no{background:var(--stop);color:#fff}
.dot.hm{background:var(--warn)}
.chk b{font-weight:600;display:block}
.chk small{color:var(--dim);font-size:12.5px;display:block;margin-top:1px}
.verdict{margin:12px 16px 0;padding:13px 15px;border-radius:8px;font-size:14.5px;font-weight:600}
.verdict.pass{background:rgba(84,184,127,.13);color:#87D6A9}
.verdict.fail{background:rgba(226,80,79,.13);color:#F08C8B}
#override{margin:10px 16px 0;width:calc(100% - 32px);padding:12px;font-size:13.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:8px;display:none}
.acts{display:flex;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.acts button{flex:1;padding:16px;border-radius:8px;font-weight:600;font-size:16px}
.keep{background:var(--go);color:#0E1A13}
.keep[disabled]{background:var(--panel2);color:#5D646E}
.again{border:1px solid var(--line);color:var(--text)}

.reasons{padding:0 16px}
.reasons button{width:100%;text-align:left;padding:16px 15px;margin-bottom:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;font-size:15.5px}

.isec{font-family:var(--cond);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--hi);
  margin:26px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.q{margin:17px 0}
.q label{display:block;font-size:16px;font-weight:600;margin-bottom:9px;line-height:1.3}
.need{color:var(--stop);font-style:normal;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:11px 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-size:14.5px;line-height:1.25;text-align:left}
.opt.on{background:var(--hi);color:#15171B;border-color:var(--hi);font-weight:600}
.q input,.q textarea{width:100%;padding:14px;font:inherit;font-size:16px;background:var(--panel);
  color:var(--text);border:1px solid var(--line);border-radius:7px}
.q input:focus,.q textarea:focus{outline:2px solid var(--hi);outline-offset:1px}
.q textarea{resize:vertical}

.done{padding:26px 4px}
.done h1{font-size:clamp(34px,10vw,46px);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;margin:20px 0}
.grid div{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--panel2)}
.grid img{width:100%;height:100%;object-fit:cover}
.grid span{position:absolute;left:0;right:0;bottom:0;background:rgba(10,12,15,.82);font-size:9px;
  padding:3px 4px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid div.gap{display:grid;place-items:center;color:var(--warn);font-size:10px;padding:6px;text-align:center;line-height:1.2}
.stat{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.stat span{color:var(--dim)}
.stat b{font-family:var(--cond);font-size:19px;font-weight:600;flex:none}
.stat b.txt{font-family:var(--sans);font-size:14px;text-align:right;font-weight:600}
.sub{color:var(--dim);font-size:14px;margin-top:20px}
</style>
</head>
<body>

<header>
  <div class="job">
    <b id="jobno">JOB 22028</b>
    <span id="jobdesc">2016 Kenworth T880 Dump · Hiram, GA</span>
  </div>
  <div class="lang">
    <button id="en" aria-pressed="true">EN</button>
    <button id="es" aria-pressed="false">ES</button>
  </div>
</header>

<div class="ticks" id="ticks"></div>
<main id="main"></main>

<div class="dock" id="dock">
  <button class="shoot" id="shoot"></button>
  <button class="minor" id="skip"></button>
  <button class="minor" id="pick"></button>
  <input type="file" id="cam" accept="image/*" capture="environment">
  <input type="file" id="lib" accept="image/*">
</div>

<div class="sheet" id="review">
  <div class="shot-wrap"><img id="preview" alt=""></div>
  <div class="checks" id="checks"></div>
  <div class="verdict" id="verdict"></div>
  <button id="override"></button>
  <div class="acts">
    <button class="again" id="again"></button>
    <button class="keep" id="keep"></button>
  </div>
</div>

<div class="sheet" id="skipsheet">
  <main>
    <div class="count" id="skiplabel"></div>
    <h1 id="skiptitle"></h1>
    <div class="reasons" id="reasons"></div>
  </main>
  <div class="acts"><button class="again" id="skipcancel"></button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>

/* ============================================================ shot list
   Sections mirror how a person walks a unit. Slots marked `multi` take as
   many photos as the asset warrants — the appraiser is pricing this sight
   unseen, so more coverage is strictly better.
   ============================================================ */
const SECTIONS = {
  walk:{en:"Walkaround",es:"Vuelta completa"},
  tags:{en:"Tags and plates",es:"Placas y etiquetas"},
  cab:{en:"Cab",es:"Cabina"},
  eng:{en:"Engine",es:"Motor"},
  gear:{en:"Running gear",es:"Tren rodante"},
  body:{en:"Body",es:"Caja"},
  cond:{en:"Condition",es:"Condición"}
};

const SHOTS = [
{sec:"walk",id:"w1",must:true,art:"threequarter",
 en:["Front, driver corner","Stand back at the corner. Front and driver side both in the shot."],
 es:["Frente, esquina del conductor","Párese en la esquina. Frente y lado del conductor en la foto."]},
{sec:"walk",id:"w2",must:true,art:"side",
 en:["Driver side, full length","Square to the side. Every axle visible."],
 es:["Lado del conductor, completo","De frente al costado. Todos los ejes visibles."]},
{sec:"walk",id:"w3",must:true,art:"threequarter",
 en:["Rear, driver corner","Back corner, showing the side and the tail together."],

{sec:"walk",id:"w4",must:true,art:"rear",
 en:["Straight on from behind","Whole tail. Lights and gate in frame."],
 es:["De frente desde atrás","Toda la cola. Luces y compuerta en el cuadro."]},
{sec:"walk",id:"w5",must:true,art:"threequarter",
 en:["Rear, passenger corner","Opposite back corner."],
 es:["Trasera, esquina del pasajero","Esquina trasera opuesta."]},
{sec:"walk",id:"w6",must:true,art:"side",
 en:["Passenger side, full length","Square to the side, same as the driver side."],
 es:["Lado del pasajero, completo","De frente al costado, igual que el otro lado."]},
{sec:"walk",id:"w7",must:true,art:"threequarter",
 en:["Front, passenger corner","Front corner on the passenger side."],
 es:["Frente, esquina del pasajero","Esquina delantera del lado del pasajero."]},
{sec:"walk",id:"w8",must:true,art:"rear",
 en:["Straight on from the front","Grille, bumper, and both headlights."],
 es:["De frente","Parrilla, defensa y ambos faros."]},

{sec:"tags",id:"tags",must:true,multi:true,min:4,art:"plate",
 en:["Tags, plates and stickers",
     "One photo per plate. Door jamb VIN, engine tag, transmission tag, axle tags, body maker plate, DOT sticker, tire sidewalls. Get close — every character has to be readable."],
 es:["Placas, etiquetas y calcomanías",
     "Una foto por placa. VIN en la puerta, placa del motor, de la transmisión, de los ejes, del fabricante de la caja, calcomanía DOT, costados de llantas. Acérquese — cada carácter debe leerse."]},

{sec:"cab",id:"odo",must:true,art:"gauge",

{sec:"cab",id:"dash",must:true,art:"gauge",
 en:["Dash, key on, engine off","Every warning light lit. Don't start it first."],
 es:["Tablero, llave encendida, motor apagado","Todas las luces encendidas. No la arranque antes."]},
{sec:"cab",id:"gauges",must:true,multi:true,min:2,art:"gauge",

/* ============================================================ quality
   Focus is measured per tile, not across the frame. A thumb over the lens
   is a soft patch inside an otherwise sharp picture, and a global average
   hides it completely.
   ============================================================ */
const MIN_MP = 3.0, TILE_SHARP = 45, SHARP_SHARE = 0.42;
const DARK = 52, BRIGHT = 212, EDGE_BLEED = 0.30;
const BLOB_SHARE = 0.075;
const SOFT_REL = 0.22;   // a tile is soft if far below the frame's own median
const GX = 8, GY = 6;

function analyse(img){
  const W = 560, H = Math.max(1, Math.round(img.naturalHeight/img.naturalWidth*W));
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,W,H);
  const px = ctx.getImageData(0,0,W,H).data;

  const g = new Float32Array(W*H), skin = new Uint8Array(W*H);
  let sum = 0, skinCount = 0;
  for(let i=0,p=0;i<px.length;i+=4,p++){
    const r=px[i], gr=px[i+1], b=px[i+2];
    g[p] = 0.299*r+0.587*gr+0.114*b; sum += g[p];
    const cb = 128-0.168736*r-0.331264*gr+0.5*b;
    const cr = 128+0.5*r-0.418688*gr-0.081312*b;
    if(cb>=77&&cb<=130&&cr>=134&&cr<=180&&r>60&&r>b){ skin[p]=1; skinCount++; }
  }
  const mean = sum/(W*H);

  const tw = Math.floor(W/GX), th = Math.floor(H/GY), tile = [];
  for(let ty=0;ty<GY;ty++)for(let tx=0;tx<GX;tx++){
    const x0=tx*tw,y0=ty*th,x1=Math.min(x0+tw,W-1),y1=Math.min(y0+th,H-1);
    let ls=0,lss=0,n=0,sk=0,tot=0,lum=0;
    for(let y=Math.max(y0,1);y<y1;y++)for(let x=Math.max(x0,1);x<x1;x++){
      const p=y*W+x;
      const l=4*g[p]-g[p-1]-g[p+1]-g[p-W]-g[p+W];
      ls+=l; lss+=l*l; n++; sk+=skin[p]; lum+=g[p]; tot++;
    }
    const v = n ? lss/n-(ls/n)**2 : 0;
    tile.push({tx,ty,v,skin:tot?sk/tot:0,lum:tot?lum/tot:0,
               edge:tx===0||ty===0||tx===GX-1||ty===GY-1});
  }

  // Judge focus against the picture's own median rather than a fixed number.
  // A thumb has enough skin texture to clear an absolute threshold, but it is
  // always far softer than the scene behind it.
  const sortedV = tile.map(t=>t.v).sort((a,b)=>a-b);
  const medV = sortedV[Math.floor(sortedV.length/2)];
  const softCut = Math.max(TILE_SHARP, medV*SOFT_REL);
  tile.forEach(t=> t.sharp = t.v >= softCut);
  const sharpShare = tile.filter(t=>t.sharp).length/tile.length;

  const at=(x,y)=>tile[y*GX+x];
  const seen = new Set();
  let blob=0, blobEdge=false, blobSkin=0, blobLum=0;
  for(const t of tile){
    if(t.sharp) continue;
    const key=t.ty*GX+t.tx;
    if(seen.has(key)) continue;
    const stack=[t]; seen.add(key);
    let size=0, touches=false, sk=0, lu=0;
    while(stack.length){
      const cur=stack.pop(); size++; sk+=cur.skin; lu+=cur.lum;
      if(cur.edge) touches=true;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cur.tx+dx, ny=cur.ty+dy;
        if(nx<0||ny<0||nx>=GX||ny>=GY) continue;
        const nb=at(nx,ny), k=ny*GX+nx;
        if(!nb.sharp && !seen.has(k)){ seen.add(k); stack.push(nb); }
      }
    }
    if(size>blob){ blob=size; blobEdge=touches; blobSkin=sk/size; blobLum=lu/size; }
  }

  // Sky and open pavement are also texture-free and also touch the frame edge,
  // so softness alone is not enough. A thing covering the lens is either
  // skin-coloured or a dark silhouette against a normally-lit scene.
  const blobShare = blob/tile.length;
  const blobIsSkin = blobSkin > 0.34;
  const blobIsDark = blobLum < 58 && mean > 82;
  const obstructed = blobEdge && blobShare >= BLOB_SHARE
                     && sharpShare > 0.38 && (blobIsSkin || blobIsDark);

  let emax=1; const edge=new Float32Array(W*H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const p=y*W+x;
    const gx=-g[p-W-1]-2*g[p-1]-g[p+W-1]+g[p-W+1]+2*g[p+1]+g[p+W+1];
    const gy=-g[p-W-1]-2*g[p-W]-g[p-W+1]+g[p+W-1]+2*g[p+W]+g[p+W+1];
    const m=Math.hypot(gx,gy); edge[p]=m; if(m>emax) emax=m;
  }
  const band=Math.max(2,Math.round(H*0.022)), thr=emax*0.30;
  let hot=0, tot=0;
  const touch=(x,y)=>{ if(edge[y*W+x]>thr) hot++; tot++; };
  for(let x=0;x<W;x++)for(let b=0;b<band;b++){ touch(x,b); touch(x,H-1-b); }
  for(let y=0;y<H;y++)for(let b=0;b<band;b++){ touch(b,y); touch(W-1-b,y); }
  const bleed = hot/Math.max(tot,1);

  const mp = img.naturalWidth*img.naturalHeight/1e6;
  return {w:img.naturalWidth,h:img.naturalHeight,mp:mp.toFixed(1),mpRaw:mp,
          sharpShare,mean,bleed,obstructed,blobShare,blobSkin,blobLum};
}

/* ============================================================ person check
   Colour alone cannot do this. Yellow machine paint and warm evening light on
   a silver truck sit in the same YCbCr range as skin, which is what produced
   the false positives on the CAT and the Honda. So this runs a real detector,
   lazily, and degrades to "checked after upload" if it can't load.
   ============================================================ */
let detector = null, detectorState = "idle";

async function loadDetector(){
  if(detectorState === "ready" || detectorState === "loading") return;
  if(typeof cocoSsd === "undefined"){ detectorState = "unavailable"; return; }
  detectorState = "loading";
  try{
    detector = await cocoSsd.load({base:"lite_mobilenet_v2"});
    detectorState = "ready";
  }catch(e){
    detectorState = "unavailable";
  }
}

async function findPeople(img){
  if(detectorState !== "ready") return null;
  try{
    const preds = await detector.detect(img, 8, 0.42);
    return preds.filter(p => p.class === "person");
  }catch(e){ return null; }
}

/* ============================================================ state */
let lang = "en", phase = "photos", idx = 0;
const results = {};          // id -> {shots:[], skipped?, reason?}
const answers = {};
let pending = null, handOverride = false;

const $ = s => document.querySelector(s);
const main=$("#main"), dock=$("#dock"), ticksEl=$("#ticks");
const review=$("#review"), skipsheet=$("#skipsheet"), cam=$("#cam");

function t(k,...a){ const v=T[lang][k]; return typeof v==="function"?v(...a):v; }
function shotsOf(id){ return (results[id] && results[id].shots) || []; }

function drawTicks(){
  const last = phase==="done" ? "tick done" : phase==="inspect" ? "tick now" : "tick";
  ticksEl.innerHTML = SHOTS.map((sh,i)=>{
    const r = results[sh.id], got = shotsOf(sh.id);
    let cls = "tick";
    if(r && r.skipped) cls += " skip";
    else if(got.length >= Math.max(sh.min===undefined?1:sh.min,1)) cls += " done";
    else if(got.length) cls += " part";
    else if(i===idx && phase==="photos") cls += " now";
    return `<div class="${cls}"></div>`;
  }).join("") + `<div class="${last}" style="flex:.7"></div>`;
}

/* ============================================================ photo phase */
function render(){
  if(phase==="inspect"){ renderInspect(); return; }
  if(phase==="done"){ finish(); return; }
  if(idx >= SHOTS.length){ phase="inspect"; renderInspect(); return; }

  const sh = SHOTS[idx], [title,how] = sh[lang];
  const got = shotsOf(sh.id);
  const min = sh.min===undefined ? 1 : sh.min;
  const met = got.length >= min;

  const strip = (sh.multi && got.length)
    ? `<div class="strip">${got.map((g,i)=>
        `<div><img src="${g.url}" alt=""><button class="x" data-i="${i}">×</button></div>`).join("")}</div>`
    : "";

  const need = sh.multi
    ? (min>0 ? t("needMin",min,got.length) : t("asMany",got.length))
    : (sh.must ? t("must") : t("opt"));
  const badge = sh.multi ? (met?"ok":"must") : (sh.must?"must":"opt");
  const mark  = sh.multi ? (met?"✓":"●") : (sh.must?"●":"○");

  main.innerHTML = `
    <div class="count">${SECTIONS[sh.sec][lang].toUpperCase()} · ${t("shotOf",idx+1,SHOTS.length)}</div>
    <h1>${title}</h1>
    <p class="how">${how}</p>
    <div class="req ${badge}">${mark} ${need}</div>
    ${strip}
    <figure>${ART[sh.art]||""}</figure>`;

  main.querySelectorAll(".strip .x").forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i;
      URL.revokeObjectURL(got[i].url);
      got.splice(i,1);
      render();
    };
  });

  $("#shoot").textContent = (sh.multi && got.length) ? t("another") : t("shoot");
  $("#pick").style.display = "block";
  $("#pick").textContent = t("pick");

  if(sh.multi){
    $("#skip").style.display = "block";
    $("#skip").textContent = met ? t("nextSec") : (min>0 ? t("cantSec") : t("noneHere"));
    $("#skip").dataset.mode = (met || min===0) ? "next" : "skip";
  } else {
    $("#skip").style.display = sh.must ? "block" : "none";
    $("#skip").textContent = t("skip");
    $("#skip").dataset.mode = "skip";
  }

  main.scrollTop = 0;
  drawTicks();
}

function advance(){ idx++; render(); }

$("#shoot").onclick = ()=>{
  if(phase==="inspect"){ if(inspectDone()){ phase="done"; finish(); } return; }
  cam.click();
};
$("#pick").onclick = ()=> $("#lib").click();

function handleFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async ()=>{
    const meta = analyse(img);
    meta.bytes = file.size;
    meta.people = "pending";
    pending = {url, file, meta};
    handOverride = false;
    showReview(url, meta);

    const found = await findPeople(img);
    if(!pending || pending.url !== url) return;     // moved on already
    meta.people = found === null ? "unknown" : found.length;
    showReview(url, meta);
  };
  img.src = url;
}
cam.onchange = handleFile;
$("#lib").onchange = handleFile;

function showReview(url, m){
  $("#preview").src = url;
  const rows = [];
  const row=(st,label,hint)=>rows.push(
    `<div class="chk"><div class="dot ${st}">${st==="ok"?"✓":st==="no"?"✕":"!"}</div>
     <div><b>${label}</b><small>${hint}</small></div></div>`);

  const resOk = m.mpRaw >= MIN_MP;
  row(resOk?"ok":"no", resOk?t("resOk",m):t("resLow",m), resOk?t("resHint"):t("resLowHint"));

  const sharp = m.sharpShare >= SHARP_SHARE;
  row(sharp?"ok":"no", sharp?t("sharp"):t("soft"), sharp?t("sharpHint"):t("softHint"));

  row(m.obstructed?"no":"ok", m.obstructed?t("covered"):t("clear"),
      m.obstructed?t("coveredHint"):t("clearHint"));

  const pending_people = m.people === "pending";
  const unknown_people = m.people === "unknown";
  const sawPerson = typeof m.people === "number" && m.people > 0;
  const handFail = sawPerson && !handOverride;

  if(pending_people)      row("hm", t("handWait"), t("handWaitHint"));
  else if(unknown_people) row("hm", t("handSkip"), t("handSkipHint"));
  else if(sawPerson)      row(handOverride?"ok":"no",
                              handOverride?t("handsOk"):t("hands"),
                              handOverride?t("handsOkHint"):t("handsHint"));
  else                    row("ok", t("noHands"), t("noHandsHint"));

  const dark = m.mean<DARK, blown = m.mean>BRIGHT;
  row(dark||blown?"hm":"ok", dark?t("dark"):blown?t("bright"):t("light"),
      dark?t("darkHint"):blown?t("brightHint"):t("lightHint"));

  const framed = m.bleed < EDGE_BLEED;
  row(framed?"ok":"hm", framed?t("frame"):t("cut"), framed?t("frameHint"):t("cutHint"));

  $("#checks").innerHTML = rows.join("");

  const blocked = !resOk || !sharp || m.obstructed || handFail || pending_people;
  const v = $("#verdict");
  v.className = "verdict " + (blocked?"fail":"pass");
  v.textContent = blocked ? t("fail") : t("pass");

  // skin detection misfires on cardboard, bare wood and some paint, so give a
  // logged way past it rather than a dead end in a yard at 4pm
  const ov = $("#override");
  ov.style.display = (handFail && resOk && sharp && !m.obstructed) ? "block" : "none";
  ov.textContent = t("notAHand");

  $("#keep").disabled = blocked;
  $("#keep").textContent = t("keep");
  $("#again").textContent = t("again");
  review.classList.add("on");
}

$("#override").onclick = ()=>{
  handOverride = true;
  if(pending){ pending.meta.handOverridden = true; showReview(pending.url, pending.meta); }
};

$("#keep").onclick = ()=>{
  const sh = SHOTS[idx];
  if(!results[sh.id]) results[sh.id] = {shots:[]};
  results[sh.id].shots.push(pending);
  pending = null; handOverride = false;
  review.classList.remove("on");
  if(sh.multi) render(); else advance();
};

$("#again").onclick = ()=>{
  if(pending) URL.revokeObjectURL(pending.url);
  pending = null; handOverride = false;
  review.classList.remove("on");
};

$("#skip").onclick = ()=>{
  const sh = SHOTS[idx];
  if($("#skip").dataset.mode === "next"){
    if(!results[sh.id]) results[sh.id] = {shots:[]};
    advance(); return;
  }
  $("#skiplabel").textContent = t("shotOf",idx+1,SHOTS.length);
  $("#skiptitle").textContent = t("why");
  $("#reasons").innerHTML = SKIP_REASONS[lang]
    .map((r,i)=>`<button data-i="${i}">${r}</button>`).join("");
  $("#reasons").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      results[sh.id] = {shots:shotsOf(sh.id), skipped:true,
                        reason:SKIP_REASONS[lang][+b.dataset.i]};
      skipsheet.classList.remove("on");
      advance();
    };
  });
  $("#skipcancel").textContent = t("cancel");
  skipsheet.classList.add("on");
};
$("#skipcancel").onclick = ()=> skipsheet.classList.remove("on");

/* ============================================================ inspection phase */
function inspectDone(){
  return INSPECT.every(g=>g.items.every(it=>
    !it.req || (answers[it.id]!==undefined && answers[it.id]!==null &&
      (it.multi ? answers[it.id].length : String(answers[it.id]).trim()!==""))));
}

function renderItem(it){
  const label = it[lang];
  const need = it.req ? `<i class="need">•</i>` : "";
  if(it.text || it.num){
    const v = answers[it.id] || "";
    return `<div class="q"><label for="f_${it.id}">${need}${label}</label>${
      it.long
        ? `<textarea id="f_${it.id}" data-id="${it.id}" rows="3" placeholder="${it.ph[lang]}">${v}</textarea>`
        : `<input id="f_${it.id}" data-id="${it.id}" type="${it.num?"number":"text"}"
             inputmode="${it.num?"numeric":"text"}" placeholder="${it.ph[lang]}" value="${v}">`
    }</div>`;
  }
  const cur = answers[it.id]!==undefined ? answers[it.id] : (it.multi?[]:null);
  const opts = it.opts.map((o,i)=>{
    const txt = lang==="en" ? o[0] : o[1];
    const on = it.multi ? cur.includes(i) : cur===i;
    return `<button class="opt${on?" on":""}" data-id="${it.id}" data-i="${i}" data-multi="${it.multi?1:0}">${txt}</button>`;
  }).join("");
  return `<div class="q"><label>${need}${label}</label><div class="opts">${opts}</div></div>`;
}

function renderInspect(){
  dock.style.display = "block";
  $("#shoot").textContent = t("send");
  const ok = inspectDone();
  $("#shoot").disabled = !ok;
  $("#shoot").style.opacity = ok ? "1" : ".45";
  $("#skip").style.display = "none";
  $("#pick").style.display = "none";

  main.innerHTML = `
    <div class="count">${t("inspectStep")}</div>
    <h1>${t("inspectTitle")}</h1>
    <p class="how">${t("inspectHow")}</p>
    ${INSPECT.map(g=>`<div class="isec">${g.sec[lang]}</div>
      ${g.items.map(renderItem).join("")}`).join("")}
    <div style="height:10px"></div>`;

  main.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, i=+b.dataset.i, multi=b.dataset.multi==="1";
      if(multi){
        const cur = answers[id] || [];
        answers[id] = cur.includes(i) ? cur.filter(x=>x!==i) : [...cur,i];
      } else {
        answers[id] = answers[id]===i ? null : i;
      }
      const y = main.scrollTop;
      renderInspect();
      main.scrollTop = y;
    };
  });
  main.querySelectorAll("input,textarea").forEach(f=>{
    f.oninput = ()=>{
      answers[f.dataset.id] = f.value;
      const ok = inspectDone();
      $("#shoot").disabled = !ok;
      $("#shoot").style.opacity = ok ? "1" : ".45";
    };
  });
  drawTicks();
}

/* ============================================================ done */
function summarise(){
  const out = [];
  INSPECT.forEach(g=>g.items.forEach(it=>{
    const a = answers[it.id];
    if(a===undefined||a===null||a===""||(Array.isArray(a)&&!a.length)) return;
    let v;
    if(it.opts) v = Array.isArray(a)
      ? a.map(i=>lang==="en"?it.opts[i][0]:it.opts[i][1]).join(", ")
      : (lang==="en"?it.opts[a][0]:it.opts[a][1]);
    else v = a;
    out.push(`<div class="stat"><span>${it[lang]}</span><b class="txt">${v}</b></div>`);
  }));
  return out.join("");
}

function finish(){
  let taken = 0, skipped = 0;
  const mps = [], cells = [];

  SHOTS.forEach(sh=>{
    const r = results[sh.id], got = shotsOf(sh.id);
    taken += got.length;
    got.forEach(g=>{
      mps.push(g.meta.mpRaw);
      cells.push(`<div><img src="${g.url}" alt=""><span>${sh[lang][0]}</span></div>`);
    });
    if(r && r.skipped){
      skipped++;
      cells.push(`<div class="gap">${r.reason}</div>`);
    } else if(!got.length && (sh.must || (sh.min||0)>0)){
      cells.push(`<div class="gap">${t("missing")}<br>${sh[lang][0]}</div>`);
    }
  });

  const low = mps.length ? Math.min(...mps).toFixed(1) : "—";
  const avg = mps.length ? (mps.reduce((a,b)=>a+b,0)/mps.length).toFixed(1) : "—";

  main.innerHTML = `
    <div class="done">
      <h1>${t("doneTitle")}</h1>
      <div class="grid">${cells.join("")}</div>
      <div class="stat"><span>${t("sTotal")}</span><b>${taken}</b></div>
      <div class="stat"><span>${t("sSkipped")}</span><b>${skipped}</b></div>
      <div class="stat"><span>${t("sSize")}</span><b>${low} MP</b></div>
      <div class="stat"><span>${t("sAvg")}</span><b>${avg} MP</b></div>
      <div class="isec" style="margin-top:22px">${t("inspectSum")}</div>
      ${summarise()}
      <p class="sub">${t("doneSub")}</p>
      <p class="sub">${t("tip")}</p>
    </div>`;
  dock.style.display = "none";
  drawTicks();
}

/* ============================================================ language */
function setLang(l){
  lang = l;
  $("#en").setAttribute("aria-pressed", l==="en");
  $("#es").setAttribute("aria-pressed", l==="es");
  document.documentElement.lang = l;
  render();
}
loadDetector();
$("#en").onclick = ()=> setLang("en");
$("#es").onclick = ()=> setLang("es");

render();
</script>
</body>
</html>
